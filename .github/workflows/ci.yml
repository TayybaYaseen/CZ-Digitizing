name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: czdigitizing_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Version intentionally omitted: root package.json already pins "packageManager":
      # "pnpm@9.12.0". Passing `version:` here too makes the action fail immediately with
      # "Multiple versions of pnpm specified" — the packageManager field is the single source
      # of truth for the pnpm version, and it's more precise (exact patch) than a workflow input.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Belt-and-suspenders alongside apps/api's own "postinstall": "prisma generate" —
      # @prisma/client's own postinstall hook fails to auto-locate a schema that isn't at a
      # default location (ours is apps/api/prisma/schema.prisma) and silently no-ops instead
      # of erroring, so a missing/stale client here shows up much later as confusing
      # "Module has no exported member 'User'" failures in lint/typecheck instead. Making it
      # an explicit, visible CI step catches that class of failure immediately and clearly.
      - name: Generate Prisma Client
        run: pnpm --filter @czd/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/czdigitizing_test
