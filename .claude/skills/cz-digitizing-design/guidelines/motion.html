<!-- @dsCard group="Spacing" viewport="700x160" name="Motion" subtitle="Short, flat transitions — no bounce, no springs" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 18px;background:var(--surface-card);font-family:var(--font-body);color:var(--text-body)}table{border-collapse:collapse;font-size:11px;width:100%}td{padding:4px 8px;border-bottom:1px solid var(--border-subtle)}td:first-child{font-family:var(--font-mono);color:var(--text-strong);white-space:nowrap}td:last-child{text-align:right;font-family:var(--font-mono);color:var(--gold-700)}</style></head><body>
<table>
<tr><td>--dur-instant</td><td>press / active feedback</td><td>80ms</td></tr>
<tr><td>--dur-fast</td><td>hover colour + border changes</td><td>140ms</td></tr>
<tr><td>--dur-normal</td><td>card lift, accordion chevron</td><td>220ms</td></tr>
<tr><td>--dur-slow</td><td>panel and drawer entrances</td><td>360ms</td></tr>
<tr><td>--ease-standard</td><td>default for all controls</td><td>cubic-bezier(.2,.6,.3,1)</td></tr>
<tr><td>--ease-out</td><td>entrances, hover lifts</td><td>cubic-bezier(.16,.84,.44,1)</td></tr>
</table></body></html>
