<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Shadows are navy-tinted and low-contrast; gold glow only on primary CTAs" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 18px;background:var(--surface-card);font-family:var(--font-body);color:var(--text-body)}.r{display:flex;gap:16px;flex-wrap:wrap}.c{text-align:center}.b{width:110px;height:58px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card)}.n{font-family:var(--font-mono);font-size:9px;color:var(--text-faint);margin-top:7px}body{background:var(--surface-page)}</style></head><body>
<div class="r">
<div class="c"><div class="b" style="box-shadow:var(--shadow-xs)"></div><div class="n">--shadow-xs</div></div>
<div class="c"><div class="b" style="box-shadow:var(--shadow-sm)"></div><div class="n">--shadow-sm<br>cards</div></div>
<div class="c"><div class="b" style="box-shadow:var(--shadow-md)"></div><div class="n">--shadow-md<br>hover</div></div>
<div class="c"><div class="b" style="box-shadow:var(--shadow-lg)"></div><div class="n">--shadow-lg<br>featured plan</div></div>
<div class="c"><div class="b" style="background:var(--navy-800);box-shadow:var(--shadow-navy)"></div><div class="n">--shadow-navy</div></div>
<div class="c"><div class="b" style="background:var(--gold-500);border-color:var(--gold-500);box-shadow:var(--shadow-gold)"></div><div class="n">--shadow-gold</div></div>
</div></body></html>
