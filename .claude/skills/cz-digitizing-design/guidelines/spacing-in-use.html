<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing in use" subtitle="A KPI row: 12px grid gap, 14px card padding" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 18px;background:var(--surface-card);font-family:var(--font-body);color:var(--text-body)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.k{padding:14px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)}.l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}.v{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--text-strong);line-height:1.15;margin-top:2px}.d{font-size:11px;font-weight:600;color:var(--green-600);margin-top:2px}body{background:var(--surface-page)}</style></head><body>
<div class="grid">
<div class="k"><div class="l">Total Customers</div><div class="v">1,248</div><div class="d">+12% this month</div></div>
<div class="k"><div class="l">Total Orders</div><div class="v">892</div><div class="d">+18% this month</div></div>
<div class="k"><div class="l">Total Revenue</div><div class="v">$48,750</div><div class="d">+22% this month</div></div>
<div class="k"><div class="l">Pending</div><div class="v">23</div><div class="d" style="color:var(--red-600)">Needs attention</div></div>
</div></body></html>
